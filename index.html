
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Title Here</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      width: 85%;
      max-width: 360px;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 16px #0002;
    }
    h1 { text-align: center; }
    label {
      display: block;
      margin: 16px 0 6px;
    }
    input, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font: inherit;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      background: #1877f2;
      color: white;
      border: 0;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Your Title Here</h1>
    <p>Send us your request and we will respond by email.</p>

    <https://formsubmit.co/richardbrown00@outlook.fr
          method="POST">
      <input type="hidden" name="_subject"
             value="New customer request">
      <input type="hidden" name="_captcha" value="true">

      <label for="contact">Email address or phone number</label>
      <input id="contact" name="contact"
             autocomplete="off" required>

      <label for="message">Your request</label>
      <textarea id="message" name="message"
                rows="4" required></textarea>

      <button type="submit">Send Request</button>
    </form>
  </main>
</body>
</html>
